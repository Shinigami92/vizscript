name: Feature request
description: Suggest an idea, a new language or a new provider
labels: ['s: pending triage', 'c: feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
