name: Bug report
description: Report something that does not work as expected
labels: ['s: pending triage', 'c: bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps or a code snippet (ideally one that works in the playground).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
