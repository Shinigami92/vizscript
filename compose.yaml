name: vizscript

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vizscript
      POSTGRES_PASSWORD: vizscript
      POSTGRES_DB: vizscript
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vizscript -d vizscript']
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://vizscript:vizscript@db:5432/vizscript
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (at least 32 chars)}
      PORT: 3333
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  db-data:
